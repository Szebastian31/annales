<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Annales phone screen</title>
<!-- Used by tools/screenshots.sh. Chrome won't make a window narrower than about 500 px, so a screen is shown
     here in an exact 390 × 844 phone-sized frame, drawn twice as big to fill a 780 × 1688 window.
     Everything after "?" is passed on, e.g. phone.html?screen=journal -->
<style>
  html,body{margin:0;width:780px;height:1688px;overflow:hidden;background:#CDAE84}
  iframe{display:block;width:390px;height:844px;border:0;transform:scale(2);transform-origin:0 0}
</style>
</head>
<body>
<iframe id="f" title="Annales"></iframe>
<script>document.getElementById('f').src = 'screens.html' + location.search;</script>
</body>
</html>
