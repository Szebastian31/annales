name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # lets the build publish the APK to the latest-debug release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # No wrapper in the repo: the action installs Gradle 8.13 (what AGP 8.13 needs) and caches it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # Release files don't count against the Actions storage quota; each build replaces the last APK.
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk annales-debug.apk
          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug --prerelease --title "Latest debug build" --notes "Rebuilt on every push to main."
          gh release upload latest-debug annales-debug.apk --clobber
          gh release edit latest-debug --notes "Annales 0.1.0 pre-release. Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')."
