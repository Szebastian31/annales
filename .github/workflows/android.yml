name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # lets the build publish each version as a release

env:
  # the family signing key, read by the app build file
  FAMILY_KEYSTORE_B64: ${{ secrets.FAMILY_KEYSTORE_B64 }}
  FAMILY_KEYSTORE_PASSWORD: ${{ secrets.FAMILY_KEYSTORE_PASSWORD }}
  FAMILY_KEY_PASSWORD: ${{ secrets.FAMILY_KEY_PASSWORD }}
  FAMILY_KEY_ALIAS: ${{ secrets.FAMILY_KEY_ALIAS }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # No wrapper in the repo: the action installs Gradle 8.13 (what AGP 8.13 needs) and caches it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      # One release per versionName in app/build.gradle.kts. Pushing again without a new
      # version just replaces that release's APK. Versions below 1.0 are marked pre-release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 versionName app/build.gradle.kts | cut -d\" -f2)
          APK="Annales_v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$APK" --clobber
          else
            PRE=""; case "$VERSION" in 0.*) PRE="--prerelease" ;; esac
            gh release create "v${VERSION}" "$APK" $PRE --target "$GITHUB_SHA" \
              --title "Annales v${VERSION}" \
              --notes "Download **${APK}** below and open it on your phone to install.

          Your journal, photos and stamps stay on your phone. No account, no cloud, no server.

          **New signing key.** If you installed an older Annales, save a backup in Profile first, uninstall it once, then install this one. From now on updates install normally."
          fi
